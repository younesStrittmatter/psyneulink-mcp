[project]
name = "psyneulink-mcp"
version = "0.1.0"
description = "MCP server exposing PsyNeuLink as LLM-friendly tools, with auto-generated tool descriptions."
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
    "psyneulink",
    "pyyaml>=6",
]

[project.optional-dependencies]
# Only required when using the Anthropic API adapter for build-time codegen.
# The default `claude_cli` adapter shells out to the local `claude` CLI and
# does not need this dep, so the install stays lean.
anthropic-api = ["anthropic>=0.40"]
# PSYCHE behavioral-data tools. Pulls in the sibling `psyneulink-psyche`
# data-convention package + pandas. Server boots fine without this extra;
# the psyche tools only error at call time. See tools/curated/psyche.py.
psyche = [
    "psyneulink-psyche>=0.1",
    "pandas>=2",
]

[tool.uv.sources]
# psyneulink-psyche is not yet on PyPI; resolve it from the sibling repo
# under the parent `psyneulink-ai/` workspace folder. Editable so changes
# in the sibling are picked up without a re-sync.
psyneulink-psyche = { path = "../psyneulink-psyche", editable = true }
# Pull PsyNeuLink from the upstream `devel` branch rather than PyPI.
# We codegen tools off the live source; PyPI lags devel by several
# weeks/months, so any new mechanism / projection landed on devel only
# becomes available to the agent here.
psyneulink = { git = "https://github.com/PrincetonUniversity/PsyNeuLink", branch = "devel" }

[project.scripts]
psyneulink-mcp           = "psyneulink_mcp.server:main"
psyneulink-mcp-generate  = "psyneulink_mcp.generator.orchestrator:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/psyneulink_mcp"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "integration: hits real LLM / real PNL imports; slow + costs money",
]
