[project]
name = "psyneulink-mcp"
version = "0.1.0"
description = "MCP server exposing PsyNeuLink as LLM-friendly tools, with auto-generated tool descriptions."
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
    "psyneulink",
]

[project.scripts]
psyneulink-mcp = "psyneulink_mcp.server:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/psyneulink_mcp"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
